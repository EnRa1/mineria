name: Pipeline de contenido mineria.com.ar
permissions: write-all
on:
  workflow_dispatch: {}
jobs:
  generar-borradores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}
        run: python mineria_pipeline.py
      - name: Commitear borradores nuevos
        run: |
          git config user.name "mineria-com-ar-bot"
          git config user.email "bot@mineria.com.ar"
          git add -A drafts/ seen.json titulos_recientes.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Borradores automaticos $(date +'%Y-%m-%d %H:%M')"
          git push
